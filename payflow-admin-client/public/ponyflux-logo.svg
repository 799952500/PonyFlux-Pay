<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PonyFlux Pay">
  <defs>
    <linearGradient id="pf-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="pf-text" x1="16" y1="20" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="18" fill="url(#pf-bg)"/>

  <!-- PF 字标 -->
  <text
    x="32"
    y="40"
    text-anchor="middle"
    font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', system-ui, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-1.5"
    fill="url(#pf-text)"
  >PF</text>

  <!-- 底部 Flux 流线 -->
  <path
    d="M18 46 C24 43, 40 43, 46 46"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-opacity="0.55"
    fill="none"
  />
  <circle cx="46" cy="46" r="2" fill="#fde68a" opacity="0.9"/>
</svg>
