server:
  port: 3004
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: payflow-recon-server
  datasource:
    admin:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://127.0.0.1:3306/payflow_admin?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: root
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 5000
        idle-timeout: 300000
        max-lifetime: 600000
    cashier:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://127.0.0.1:3306/payflow_cashier?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: root
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 5000
        idle-timeout: 300000
        max-lifetime: 600000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# xxl-job：无调度中心时保持 enabled=false，避免启动连不上 admin
xxl:
  job:
    enabled: false
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin
    executor:
      appname: payflow-recon
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 7

payflow:
  recon:
    internal-token: ${INTERNAL_TOKEN:dev-payflow-internal-token}
    poller:
      enabled: true
      fixed-delay-ms: 5000
    merchant-poller:
      enabled: true
      fixed-delay-ms: 5000
    storage:
      type: local
      local-path: ./data/recon-files
      s3:
        endpoint: ""
        region: us-east-1
        bucket: payflow-recon
        access-key: ""
        secret-key: ""
        path-style-access: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Flyway 数据库迁移（仅管理 recon 表在 payflow_admin 库）
spring.flyway:
  enabled: true
  locations: classpath:db/migration/recon
  table: flyway_recon_schema_history
  baseline-on-migrate: true
  baseline-version: 1

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.payflow.recon: DEBUG
