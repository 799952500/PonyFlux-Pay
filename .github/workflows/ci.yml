name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            payflow-admin-client/package-lock.json
            payflow-cashier-client/package-lock.json

      - name: Merchant isolation security gate (cashier-server)
        run: >
          mvn -B -q -pl payflow-cashier-server -am
          "-Dsurefire.failIfNoSpecifiedTests=false"
          "-Dtest=MerchantIsolationSecurityTest,MerchantControllerArchTest,MerchantIdGuardTest,ResourceOwnershipServiceTest"
          test

      - name: Maven compile + test (all modules)
        run: mvn -B -q compile test

      - name: npm ci + build admin client
        working-directory: payflow-admin-client
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: npm ci + build cashier client
        working-directory: payflow-cashier-client
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: root
      DB_USERNAME: root
      JWT_SECRET: ci-test-jwt-secret-key-32chars!!
      SIGNATURE_SECRET: ci-test-signature-secret-key!!
      INTERNAL_TOKEN: ci-internal-token
      MASTER_KEY: dGVzdC1tYXN0ZXIta2V5LTMyYnl0ZXMtbG9uZw==
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: payflow-admin-client/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install demo database
        run: pip install pymysql && python scripts/install_demo_db.py

      - name: Start backend servers
        run: |
          mvn -B -q -pl payflow-admin-server,payflow-cashier-server,payflow-recon-server -am -DskipTests package
          nohup mvn -B -q -pl payflow-admin-server spring-boot:run -Dspring-boot.run.profiles=prod > admin.log 2>&1 &
          nohup mvn -B -q -pl payflow-cashier-server spring-boot:run -Dspring-boot.run.profiles=prod > cashier.log 2>&1 &
          nohup mvn -B -q -pl payflow-recon-server spring-boot:run -Dspring-boot.run.profiles=prod > recon.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3003/actuator/health && curl -fsS http://127.0.0.1:3002/actuator/health && curl -fsS http://127.0.0.1:3004/actuator/health && break
            sleep 5
          done

      - name: Playwright admin smoke
        working-directory: payflow-admin-client
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium
          npx playwright test --grep @smoke || npx playwright test e2e/recon-dashboard.spec.ts
